name: Weekly IMDb Update

on:
  schedule:
    # Sunday 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * 0'

  # Allow manual execution from GitHub Actions tab
  workflow_dispatch:

jobs:
  imdb-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Download IMDb files
        run: |
          uv run python data_pipeline/download_imdb.py

      - name: Process IMDb files
        run: |
          uv run python data_pipeline/process_imdb.py

      - name: Merge Incremental Data
        run: |
          uv run python data_pipeline/merge_movies.py

      - name: Update PostgreSQL
        run: |
          uv run python data_pipeline/update_postgres.py