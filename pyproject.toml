[project]
name = "cine-app"
version = "0.1.0"
description = "The Encyclopedia of Entertainment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pandas>=3.0.3",
    "passlib[bcrypt]>=1.7.4",
    "polars>=1.41.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
